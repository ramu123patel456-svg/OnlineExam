<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard</title><style>body{font-family:Arial;background:#0f172a;color:#fff;margin:0}.wrap{max-width:1000px;margin:30px auto;padding:20px}.card{background:#1e293b;padding:24px;border-radius:16px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #334155;text-align:left}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff}</style></head><body><div class="wrap"><div class="card"><h1>Leaderboard <small style="font-size:12px;opacity:.65">(finalized results)</small></h1><p id="msg">Loading...</p><table><thead><tr><th>Rank</th><th>Student</th><th>Exam</th><th>Score</th><th>Percentage</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><br><button onclick="location.href='index.html'">Home</button></div></div><script>(async()=>{try{const r=await fetch('/api/leaderboard');const d=await r.json();if(!r.ok)throw Error(d.message);document.getElementById('msg').textContent=d.leaderboard.length+' students ranked';document.getElementById('rows').innerHTML=d.leaderboard.map(x=>`<tr><td>#${x.rank}</td><td>${x.name}</td><td>${x.exam}</td><td>${x.score}/${x.totalMarks}</td><td>${x.percentage}%</td><td>${x.passed?'PASS':'FAIL'}</td></tr>`).join('')||'<tr><td colspan="6">No results yet.</td></tr>'}catch(e){document.getElementById('msg').textContent=e.message}})()</script></body></html>
