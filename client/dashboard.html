<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#172554;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.danger{background:#dc2626;color:#fff}main{max-width:1200px;margin:25px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #0001;margin-top:18px}.stats h2{font-size:30px;margin:0 0 5px}.muted{color:#64748b}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.search{max-width:360px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.table-wrap{overflow:auto}.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.published{background:#dcfce7;color:#166534}.draft{background:#fef3c7;color:#92400e}.modal{position:fixed;inset:0;background:#0f172aaa;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal-box{background:#fff;width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.qbox{border:1px solid #dbe3ee;background:#f8fafc;padding:15px;border-radius:12px;margin:15px 0}.qhead{display:flex;justify-content:space-between;gap:10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.hint{font-size:13px;color:#64748b;margin:6px 0}.program{background:#111827;color:#fff;padding:10px;border-radius:8px}.program button{margin-top:8px}@media(max-width:700px){.stats,.grid,.opts{grid-template-columns:1fr}.table th:nth-child(4),.table td:nth-child(4){display:none}}</style></head><body><header><h2>Online Exam System — Admin</h2><div><span id="adminName">Administrator</span> <button class="danger" id="logout">Logout</button></div></header><main><div class="stats"><div class="card"><h2 id="total">0</h2><div class="muted">Total Exams</div></div><div class="card"><h2 id="published">0</h2><div class="muted">Published</div></div><div class="card"><h2 id="draft">0</h2><div class="muted">Drafts</div></div></div><section class="card"><div class="toolbar"><input id="search" class="search" placeholder="Search exam"><button class="primary" id="newExam">+ Set New Exam</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Exam</th><th>Subject</th><th>Class</th><th>Questions</th><th>Duration</th><th>Status</th><th>Manage</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div class="modal" id="modal"><div class="modal-box"><div class="qhead"><h2>Set New Exam</h2><button class="secondary" id="close">✕</button></div><form id="form"><div class="grid"><div><label>Exam Title</label><input id="title" required></div><div><label>Subject</label><input id="subject" required></div><div><label>Class</label><input id="className" required></div><div><label>Duration (minutes)</label><input id="duration" type="number" min="1" value="60" required></div><div><label>Passing Marks</label><input id="passing" type="number" min="0" value="4"></div><div class="full"><label>Description</label><textarea id="description"></textarea></div></div><h3>Questions</h3><div id="questions"></div><button type="button" class="secondary" id="add">+ Add Question</button><div class="footer"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save Exam as Draft</button></div></form></div></div><script>
const token=localStorage.getItem('adminToken');if(!token)location.href='admin-login.html';const $=id=>document.getElementById(id);const api=(u,o={})=>fetch(u,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(o.headers||{})}});let exams=[];
const TYPES={mcq1:'MCQ (1 correct)',mcq2:'MCQ (2 correct)',mcq3:'MCQ (3 correct)',fill_blank:'Fill in the blank',true_false:'True or False',match:'Match the following',short_answer:'Short answer',long_answer:'Long answer',programming:'Programming basic',href_page:'HTML HREF / Page Link'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function init(){let r=await api('/api/admin/me');if(!r.ok){localStorage.clear();location.href='admin-login.html';return}let d=await r.json();$('adminName').textContent=d.admin.name+' ('+d.admin.email+')';load()}
async function load(){let r=await api('/api/admin/exams');if(r.ok){exams=(await r.json()).exams;render()}}
function render(){let q=$('search').value.toLowerCase();let list=exams.filter(e=>(e.title+' '+e.subject).toLowerCase().includes(q));$('total').textContent=exams.length;$('published').textContent=exams.filter(e=>e.status==='Published').length;$('draft').textContent=exams.filter(e=>e.status==='Draft').length;$('rows').innerHTML=list.map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${esc(e.subject)}</td><td>${esc(e.className)}</td><td>${e.questions.length}</td><td>${e.durationMinutes} min</td><td><span class="badge ${e.status==='Published'?'published':'draft'}">${e.status}</span></td><td><button class="primary" onclick="publishExam('${e.id}','${e.status==='Published'?'Draft':'Published'}')">${e.status==='Published'?'Unpublish':'Publish'}</button> <button class="danger" onclick="delExam('${e.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No exams found.</td></tr>'}
function qBox(type='mcq1',data={}){let box=document.createElement('div');box.className='qbox';box.innerHTML=`<div class="qhead"><b>Question</b><button type="button" class="danger remove">Remove</button></div><label>Question type</label><select class="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${v}</option>`).join('')}</select><label>Question text</label><textarea class="qtext" required>${esc(data.question||'')}</textarea><div class="dynamic"></div><label>Marks</label><input class="marks" type="number" min="1" value="${data.marks||1}">`;box.querySelector('.remove').onclick=()=>box.remove();box.querySelector('.type').onchange=()=>drawFields(box);$('questions').appendChild(box);drawFields(box,data)}
function drawFields(box,data={}){let type=box.querySelector('.type').value,d=box.querySelector('.dynamic');let opts=data.options||[];if(type==='mcq1'||type==='mcq2'||type==='mcq3'){let n=type==='mcq1'?4:4;d.innerHTML=`<div class="opts">${[0,1,2,3].map((i)=>`<input class="opt" placeholder="Option ${String.fromCharCode(65+i)}" value="${esc(opts[i]||'')}">`).join('')}</div><div class="hint">Select the correct answer(s).</div><div class="opts check">${[0,1,2,3].map(i=>`<label><input type="checkbox" class="ans" value="${i}"> ${String.fromCharCode(65+i)}</label>`).join('')}</div>`;let a=Array.isArray(data.answer)?data.answer:[data.answer];box.querySelectorAll('.ans').forEach(x=>x.checked=a.includes(Number(x.value)));if(type==='mcq1'){box.querySelectorAll('.ans').forEach(x=>x.type='radio');let first=a[0];if(first!=null){let el=box.querySelector(`.ans[value="${first}"]`);if(el)el.checked=true}}
}else if(type==='fill_blank'||type==='short_answer'||type==='long_answer'){d.innerHTML=`<label>Correct answer</label><input class="answer" value="${esc(data.answer||'')}" required>`}else if(type==='true_false'){d.innerHTML=`<label>Correct answer</label><select class="answer"><option value="0">True</option><option value="1">False</option></select>`;if(data.answer!=null)d.querySelector('.answer').value=data.answer}else if(type==='match'){d.innerHTML=`<label>Pairs (one per line: Left = Right)</label><textarea class="answer" rows="4" placeholder="HTML = HyperText Markup Language\nCSS = Cascading Style Sheets">${esc(data.answer||'')}</textarea>`}else if(type==='programming'){d.innerHTML=`<div class="program"><b>Programming question uses a separate page</b><p class="hint">Only HTML, CSS, JavaScript and PHP are allowed. Student code is limited to 400 lines.</p><button type="button" onclick="openProgramming(this)">Open Programming Question Page</button></div><input type="hidden" class="answer" value="${esc(data.answer||'')}"><input type="hidden" class="language" value="${esc(data.codeLanguage||'html')}"><input type="hidden" class="starter" value="${esc(data.starterCode||'')}">`}else if(type==='href_page'){d.innerHTML=`<label>Page title</label><input class="pageTitle" value="${esc(data.pageTitle||'')}" required><label>Expected href</label><input class="href" placeholder="about.html or https://example.com" value="${esc(data.href||'')}" required><p class="hint">The student will create a page/link answer using an href. The title and href are checked automatically.</p><input type="hidden" class="answer" value="${esc(data.answer||'')}">`}}
function collect(){return [...$('questions').children].map(b=>{let type=b.querySelector('.type').value,q={type,question:b.querySelector('.qtext').value.trim(),marks:Number(b.querySelector('.marks').value)||1};if(['mcq1','mcq2','mcq3'].includes(type)){q.options=[...b.querySelectorAll('.opt')].map(x=>x.value.trim());q.answer=[...b.querySelectorAll('.ans:checked')].map(x=>Number(x.value));if(type==='mcq1')q.answer=q.answer[0]}else if(type==='true_false')q.options=['True','False'],q.answer=Number(b.querySelector('.answer').value);else if(['fill_blank','short_answer','long_answer','match'].includes(type))q.answer=b.querySelector('.answer').value.trim();else if(type==='href_page'){q.pageTitle=b.querySelector('.pageTitle').value.trim();q.href=b.querySelector('.href').value.trim();q.answer=''}else{q.answer=b.querySelector('.answer').value;q.codeLanguage=b.querySelector('.language').value;q.starterCode=b.querySelector('.starter').value}return q})}
window.openProgramming=btn=>{let box=btn.closest('.qbox');window.open('programming-question.html','programmingQuestion','width=850,height=700');window._programBox=box};window.addEventListener('message',e=>{if(e.data?.type!=='programmingQuestion'||!window._programBox)return;let b=window._programBox;b.querySelector('.qtext').value=e.data.question;b.querySelector('.answer').value=e.data.answer||'';b.querySelector('.language').value=e.data.language||'javascript';b.querySelector('.starter').value=e.data.starterCode||'';alert('Programming question added.');});
$('newExam').onclick=()=>{$('modal').classList.add('show');$('questions').innerHTML='';qBox()};$('close').onclick=$('cancel').onclick=()=>$('modal').classList.remove('show');$('add').onclick=()=>qBox();$('search').oninput=render;$('form').onsubmit=async e=>{e.preventDefault();let body={title:$('title').value.trim(),subject:$('subject').value.trim(),className:$('className').value.trim(),durationMinutes:Number($('duration').value),passingMarks:Number($('passing').value),description:$('description').value,questions:collect()};if(!body.questions.length)return alert('Add at least one question.');let invalid=body.questions.some((q,i)=>{if(!q.question)return true;if(['mcq1','true_false'].includes(q.type))return !Number.isInteger(q.answer);if(['mcq2','mcq3'].includes(q.type))return q.answer.length!==Number(q.type.slice(3));if(['fill_blank','short_answer','match'].includes(q.type))return !q.answer;if(q.type==='href_page')return !q.pageTitle||!q.href;return false});if(invalid)return alert('Please complete every question and select the correct answer(s).');let r=await api('/api/admin/exams',{method:'POST',body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.message);alert('Exam saved as Draft.');$('modal').classList.remove('show');e.target.reset();load()};window.publishExam=async(id,nextStatus)=>{if(!confirm(nextStatus==='Published'?'Publish exam?':'Unpublish exam?'))return;let r=await api('/api/admin/exams/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:nextStatus})});if(!r.ok)return alert((await r.json()).message);load()};window.delExam=async id=>{if(!confirm('Delete this exam?'))return;let r=await api('/api/admin/exams/'+id,{method:'DELETE'});if(!r.ok)return alert((await r.json()).message);load()};$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});localStorage.clear();location.href='admin-login.html'};init();</script></body></html>
