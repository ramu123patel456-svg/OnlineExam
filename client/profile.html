<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Profile</title><style>body{font-family:Arial;background:#0f172a;color:#fff;margin:0}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:#1e293b;padding:24px;border-radius:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0f172a;padding:16px;border-radius:10px}.stat b{display:block;font-size:24px;margin-top:6px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #334155;text-align:left}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><h1>My Profile</h1><div id="profile">Loading...</div></div><div class="card"><h2>My Results</h2><table><thead><tr><th>Exam</th><th>Score</th><th>Percentage</th><th>Status</th><th>Date</th></tr></thead><tbody id="results"></tbody></table><br><button onclick="location.href='index.html'">Home</button></div></div><script>(async()=>{const s=JSON.parse(sessionStorage.getItem('student')||'null');if(!s){location.href='student-login.html';return}try{const r=await fetch('/api/student/profile',{headers:{'Authorization':'Bearer '+sessionStorage.getItem('studentToken')}});const d=await r.json();if(!r.ok)throw Error(d.message);const p=d.profile;document.getElementById('profile').innerHTML=`<h2>${p.name}</h2><p>Roll Number: ${p.rollNumber}</p><div class="grid"><div class="stat">Attempts<b>${p.totalAttempts}</b></div><div class="stat">Passed<b>${p.passed}</b></div><div class="stat">Average<b>${p.averagePercentage}%</b></div><div class="stat">Best<b>${p.bestPercentage}%</b></div></div>`;document.getElementById('results').innerHTML=p.results.map(x=>`<tr><td>${x.exam.title}</td><td>${x.score}/${x.totalMarks}</td><td>${x.percentage}%</td><td>${x.passed?'PASS':'FAIL'}</td><td>${new Date(x.submittedAt).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5">No results yet.</td></tr>'}catch(e){document.getElementById('profile').textContent=e.message}})()</script></body></html>
