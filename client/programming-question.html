<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programming Question Builder</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:820px;margin:25px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 5px 20px #0001}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;box-sizing:border-box}.code{font-family:monospace;min-height:220px;background:#111827;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.save{background:#2563eb;color:#fff}.cancel{background:#e5e7eb}.note{background:#eff6ff;padding:12px;border-radius:8px;color:#1e40af}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Programming Basic Question</h1><p class="note">Create a basic programming question using only HTML, CSS, JavaScript or PHP. The student's code answer is limited to a maximum of 400 lines. This page sends the question back to the Admin Exam Builder.</p><form id="form"><label>Question</label><textarea id="question" rows="4" required placeholder="Write a programming problem..."></textarea><div class="row"><div><label>Language</label><select id="language"><option>html</option><option>css</option><option>javascript</option><option>php</option></select></div><div><label>Marks</label><input id="marks" type="number" min="1" value="5"></div></div><label>Starter Code (optional)</label><textarea id="starter" class="code" placeholder="// Starter code..."></textarea><label>Expected Answer / Solution Notes (optional)</label><textarea id="answer" rows="5" placeholder="Use this for reference or solution notes."></textarea><p>Maximum student code: <b>400 lines</b>.</p><div class="actions"><button type="button" class="cancel" onclick="window.close()">Cancel</button><button class="save">Add Programming Question</button></div></form></div><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();let code=document.getElementById('starter').value;let lines=code?code.split(/\r?\n/).length:0;if(lines>400)return alert('Starter code cannot exceed 400 lines.');window.opener?.postMessage({type:'programmingQuestion',question:document.getElementById('question').value.trim(),language:document.getElementById('language').value,starterCode:code,answer:document.getElementById('answer').value.trim(),marks:Number(document.getElementById('marks').value)||5},'*');window.close()};</script></body></html>
